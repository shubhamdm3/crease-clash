plugins { id 'com.android.application' version '8.10.1' }
android {
    namespace 'com.shubham.creaseclash.android'
    compileSdk 36
    defaultConfig {
        applicationId 'com.shubham.creaseclash'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '0.2.0'
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64' }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    sourceSets.main {
        assets.srcDirs = ['../assets']
        jniLibs.srcDirs = [layout.buildDirectory.dir('generated/natives').get().asFile]
    }
    buildTypes { release { minifyEnabled false } }
}
configurations { natives }
dependencies {
    implementation project(':gdx')
    implementation "com.badlogicgames.gdx:gdx-backend-android:$gdxVersion"
    natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-arm64-v8a"
    natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-armeabi-v7a"
    natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-x86_64"
}
tasks.register('extractNatives') {
    inputs.files configurations.natives
    outputs.dir layout.buildDirectory.dir('generated/natives')
    doLast {
        configurations.natives.files.each { jar ->
            def abi = jar.name.contains('arm64-v8a') ? 'arm64-v8a' : jar.name.contains('armeabi-v7a') ? 'armeabi-v7a' : 'x86_64'
            copy { from zipTree(jar); include '*.so'; into layout.buildDirectory.dir("generated/natives/$abi") }
        }
    }
}
tasks.named('preBuild') { dependsOn 'extractNatives' }
