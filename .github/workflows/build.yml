name: Test cricket and build Android APK
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - name: Verify simulation and build APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :core:check :desktop:classes :android:assembleDebug :android:lintDebug
      - name: Render shared scene and package desktop harness
        run: java tools/Build.java smoke
      - uses: actions/upload-artifact@v4
        with:
          name: crease-clash-debug-apk
          path: android/build/outputs/apk/debug/android-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: crease-clash-preview-and-desktop
          path: |
            build/screenshots/*.png
            build/crease-clash-desktop.jar
          if-no-files-found: error
