name: Test cricket and build Android APK
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - name: Reuse development signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: crease-clash-debug-keystore-v1
      - name: Verify simulation and build APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :core:check :desktop:classes :android:assembleDebug :android:lintDebug
      - name: Render shared scene and package desktop harness
        run: java tools/Build.java smoke
      - name: Verify APK signature and package
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose android/build/outputs/apk/debug/android-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging android/build/outputs/apk/debug/android-debug.apk > build/apk-package.txt
      - uses: actions/upload-artifact@v4
        with:
          name: crease-clash-debug-apk
          path: android/build/outputs/apk/debug/android-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: crease-clash-preview-and-desktop
          path: |
            build/screenshots/*.png
            build/crease-clash-desktop.jar
          if-no-files-found: error
      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and launch on Android 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: python3 tools/android_smoke.py
      - name: Upload Android runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crease-clash-android-runtime-check
          path: |
            build/android-smoke/
            build/apk-package.txt
